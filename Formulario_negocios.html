  <!-- ── FORM SECTION ── -->
  <section class="form-section">
    <p class="form-tagline">
      ¿Quieres que 10'000 turistas sepan que existes? Déjanos tus datos y nosotros
      te enviamos a los creadores de contenido que harán tu mesa famosa.
    </p>

    <form id="registroForm" novalidate>
      <input type="text"  id="restaurante"   placeholder="Nombre del restaurante" required />
      <input type="text"  id="ubicacion"     placeholder="Ubicación"              required />
      <input type="text"  id="cocina"        placeholder="Tipo de cocina"         required />
      <input type="text"  id="redes"         placeholder="Redes sociales actuales @" required />
      <input type="email" id="correo"        placeholder="Correo electrónico"     required />
      <button type="submit" class="btn-inscribete">Inscríbete</button>
    </form>
  </section>
